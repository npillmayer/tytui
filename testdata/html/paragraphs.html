<!doctype html>
<html lang="en">
<head>
  <title>Paragraph selection fixture</title>
  <style>
    p { color: navy; }
    .emphasis { font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <p id="first">Hello <span class="emphasis">world</span> &amp; café.</p>
    <p id="second">A second paragraph for selection and line breaking.</p>
    <div id="nested">Before <p>Nested paragraph</p> after.</div>
    <p id="break">Before<br>after.</p>
  </main>
</body>
</html>
